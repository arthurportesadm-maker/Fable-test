[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerail"
version = "0.1.0"
description = "Open-source control plane for AI agent actions: tamper-evident audit trail, declarative policies, and human approval gates for any MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tracerail Contributors" }]
keywords = ["ai-agents", "mcp", "audit", "governance", "guardrails", "compliance"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tracerail = "tracerail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
